<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Improved Source — insights dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f0f13; --panel: #17171d; --edge: #2a2a33;
        --text: #e9e9f0; --dim: #9a9aa6; --accent: #7c6cff; --good: #34d399; --bad: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 32px clamp(16px, 5vw, 64px);
      }
      header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
      h1 { font-size: 20px; margin: 0; }
      .sub { color: var(--dim); font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 26px; }
      .stat { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; }
      .stat .value { font-size: 28px; font-weight: 650; }
      .stat .label { color: var(--dim); font-size: 12px; margin-top: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
      section { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
      section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 0 0 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--edge); }
      th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
      tr:last-child td { border-bottom: 0; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--edge); }
      .pill.applied { color: var(--good); border-color: var(--good); }
      .pill.proposed { color: var(--accent); border-color: var(--accent); }
      .pill.rolled-back { color: var(--bad); border-color: var(--bad); }
      svg text { fill: var(--dim); font-size: 10px; }
      .empty { color: var(--dim); font-size: 13px; padding: 8px 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Self-improvement insights</h1>
      <span class="sub" id="generated-at"></span>
    </header>

    <div class="grid">
      <div class="stat"><div class="value" id="sessions">—</div><div class="label">Sessions analyzed</div></div>
      <div class="stat"><div class="value" id="events">—</div><div class="label">Events recorded</div></div>
      <div class="stat"><div class="value" id="friction">—</div><div class="label">Avg friction score</div></div>
      <div class="stat"><div class="value" id="signals">—</div><div class="label">Frustration signals</div></div>
    </div>

    <section>
      <h2>Friction trend (per hour bucket)</h2>
      <div id="trend"></div>
    </section>

    <section>
      <h2>Signals by kind</h2>
      <table id="kinds"></table>
    </section>

    <section>
      <h2>Top friction features</h2>
      <table id="features"></table>
    </section>

    <section>
      <h2>Improvement decisions</h2>
      <table id="proposals"></table>
    </section>

    <script type="module">
      const report = await fetch("./report.json").then((r) => r.json()).catch(() => null);
      if (!report) {
        document.body.insertAdjacentHTML(
          "beforeend",
          '<p class="empty">report.json not found — run `npm run build:report` first.</p>',
        );
      } else {
        document.getElementById("generated-at").textContent =
          "generated " + new Date(report.generatedAtMs).toLocaleString();
        document.getElementById("sessions").textContent = report.sessionsAnalyzed;
        document.getElementById("events").textContent = report.totalEvents.toLocaleString();
        document.getElementById("friction").textContent = report.averageFrictionScore;
        const totalSignals = Object.values(report.signalsByKind).reduce((a, b) => a + b, 0);
        document.getElementById("signals").textContent = totalSignals;

        renderTrend(report.frictionTrend);

        const kinds = Object.entries(report.signalsByKind).sort((a, b) => b[1] - a[1]);
        document.getElementById("kinds").innerHTML = kinds.length
          ? `<tr><th>kind</th><th>count</th></tr>` +
            kinds.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")
          : '<tr><td class="empty">No frustration signals recorded yet.</td></tr>';

        document.getElementById("features").innerHTML = report.topFeatures.length
          ? "<tr><th>feature</th><th>signals</th><th>pain score</th></tr>" +
            report.topFeatures
              .map(
                (f) =>
                  `<tr><td>${f.feature}</td><td>${f.signals}</td><td>${f.painScore.toFixed(2)}</td></tr>`,
              )
              .join("")
          : '<tr><td class="empty">Nothing hurts yet.</td></tr>';

        document.getElementById("proposals").innerHTML = report.proposals.length
          ? "<tr><th>adaptation</th><th>status</th><th>decision</th><th>when</th></tr>" +
            [...report.proposals]
              .reverse()
              .map(
                (p) =>
                  `<tr><td>${p.proposal.adaptation.id}</td>` +
                  `<td><span class="pill ${p.status}">${p.status}</span></td>` +
                  `<td>${escapeHtml(p.decisionNote)}</td>` +
                  `<td>${new Date(p.createdAtMs).toLocaleTimeString()}</td></tr>`,
              )
              .join("")
          : '<tr><td class="empty">No improvement decisions recorded yet.</td></tr>';
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      }

      function renderTrend(points) {
        if (!points || points.length < 2) {
          document.getElementById("trend").innerHTML =
            '<p class="empty">Need at least two time buckets for a trend.</p>';
          return;
        }
        const w = 640, h = 120, pad = 28;
        const xs = points.map((_, i) => pad + (i / (points.length - 1)) * (w - pad * 2));
        const ys = points.map((p) => h - pad - (p.frictionScore / 100) * (h - pad * 2));
        const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${xs[i]},${ys[i]}`).join(" ");
        document.getElementById("trend").innerHTML =
          `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="friction trend">` +
          `<path d="${path}" fill="none" stroke="#7c6cff" stroke-width="2"/>` +
          points.map((p, i) => `<circle cx="${xs[i]}" cy="${ys[i]}" r="3" fill="#7c6cff"/>`).join("") +
          `<text x="${pad}" y="${h - 8}">${new Date(points[0].startedAtMs).toLocaleTimeString()}</text>` +
          `<text x="${w - pad}" y="${h - 8}" text-anchor="end">${new Date(points.at(-1).startedAtMs).toLocaleTimeString()}</text>` +
          `</svg>`;
      }
    </script>
  </body>
</html>
